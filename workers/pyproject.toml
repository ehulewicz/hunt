[project]
name = "personal-os-worker"
version = "0.1.0"
description = "Personal OS local command line"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "rich>=14,<15",
  "starlette>=1,<2",
  "uvicorn>=0.35,<1",
  "websockets>=15,<18",
]

[project.scripts]
os = "personal_os_worker.cli:main"

[dependency-groups]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_os_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["personal_os_worker"]
