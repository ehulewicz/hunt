<!doctype html><html><body>
<input id="years" type="text" role="spinbutton" aria-valuemin="0" aria-valuemax="10" value="0">
<script>
const slider = document.querySelector('#years');
slider.addEventListener('keydown', event => {
  if (event.key === 'ArrowUp') {
    slider.value = Math.min(10, Number(slider.value) + 1);
    event.preventDefault();
  }
  if (event.key === 'ArrowDown') {
    slider.value = Math.max(0, Number(slider.value) - 1);
    event.preventDefault();
  }
});
</script>
</body></html>
