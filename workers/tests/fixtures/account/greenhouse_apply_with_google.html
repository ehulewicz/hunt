<!doctype html>
<html><head><title>Job Application for Software Engineering Intern at Acme</title></head>
<body>
<div class="autofill">
  <p>Autofill your application with MyGreenhouse</p>
  <button type="button">Sign in with Google</button>
</div>
<form id="application-form">
  <div class="field"><label for="first_name">First Name*</label><input id="first_name" type="text"></div>
  <div class="field"><label for="last_name">Last Name*</label><input id="last_name" type="text"></div>
  <div class="field"><label for="email">Email*</label><input id="email" type="email"></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV*</label><input id="resume" type="file"></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
