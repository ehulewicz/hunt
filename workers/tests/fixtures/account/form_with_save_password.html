<!doctype html>
<html><head><title>Apply - Acme</title></head>
<body>
<h1>Software Engineering Intern</h1>
<form>
  <div class="field"><label for="first">First Name*</label><input id="first" type="text"></div>
  <div class="field"><label for="last">Last Name*</label><input id="last" type="text"></div>
  <div class="field"><label for="email">Email Address*</label><input id="email" type="email"></div>
  <div class="field"><label for="phone">Phone Number*</label><input id="phone" type="tel"></div>
  <fieldset>
    <legend>Save your progress</legend>
    <p>Create a password to come back and finish later.</p>
    <label for="password">Password</label><input id="password" type="password">
  </fieldset>
  <button type="submit">Submit Application</button>
</form>
</body></html>
