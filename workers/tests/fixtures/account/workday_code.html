<!doctype html>
<html><head><title>Verify Your Email - Acme Careers</title></head>
<body>
<div role="dialog" aria-labelledby="code-title">
  <h2 id="code-title">Verify Your Email</h2>
  <p>Enter the verification code we sent to e@x.com.</p>
  <label for="code">Verification Code*</label>
  <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
         data-automation-id="verificationCode">
  <button type="submit" data-automation-id="verifyButton">Verify</button>
  <button data-automation-id="resendCode">Resend code</button>
</div>
</body></html>
