[project]
name = "personal-agent-os"
version = "0.1.0"
description = "CLI-first personal agent OS notes backed by local Supabase Postgres."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "google-genai>=2.8.0",
    "pyjwt>=2.13.0",
    "anthropic>=0.40.0",
    "playwright>=1.44.0",
    "instaloader>=4.10.3",
    "httpx>=0.28.0",
]

[project.scripts]
os = "paos.cli:main"
os-api = "paos.api.app:run"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "httpx2>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paos"]
