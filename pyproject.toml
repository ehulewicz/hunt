[project]
name = "personal-agent-os"
version = "0.1.0"
description = "CLI-first personal agent OS notes backed by local Supabase Postgres."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
paos = "paos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paos"]
